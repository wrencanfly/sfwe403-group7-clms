{% extends 'lab/base.html' %}{% block content %}<p class="eyebrow">INTAKE</p><div class="heading"><h1>Patients</h1><a class="button" href="/patients/new/">Create patient</a></div><form class="search" method="get"><label for="q">Search by name</label><input id="q" name="q" value="{{q}}"><button>Search</button></form><section class="panel"><table><thead><tr><th>Patient</th><th>Date of birth</th><th>Phone</th><th>Insurance provider</th></tr></thead><tbody>{% for p in patients %}<tr><td><a href="/patients/{{p.pk}}/">{{p}}</a></td><td>{{p.dob}}</td><td>{{p.phone}}</td><td>{{p.insurance_provider}}</td></tr>{% empty %}<tr><td colspan="4">No matching patients.</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
